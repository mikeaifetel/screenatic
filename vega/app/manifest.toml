schema-version = 1

[package]
title = "Screenatic Vega Probe"
version = "0.1.0"
# Floor so local builds pass vpt validate; pass an increasing --build-number for every Appstore upload.
build-number = 1
id = "com.screenatic.probe"

[os.version]
min = "2.0"
target = "2.0"

[needs]
[wants]
[[wants.module]]
id = "/com.amazon.kepler.net.net_manager@INetManager"

[components]
[[components.interactive]]
id = "com.screenatic.probe.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type = "singleton"
categories = ["com.amazon.category.main"]

# W3C media (MSE video playback) and PCM audio output, per docs/vega/2.0/media-player-setup.
[[wants.service]]
id = "com.amazon.mediametrics.service"

[[wants.service]]
id = "com.amazon.mediabuffer.service"

[[wants.service]]
id = "com.amazon.mediatransform.service"

[[wants.service]]
id = "com.amazon.audio.stream"

[[wants.service]]
id = "com.amazon.audio.control"

# Listed by media-player-setup as legacy, but VideoPlayer.initialize() never resolved without them
# on a Fire TV Stick 4K Select (Vega OS 2.1).
[[wants.service]]
id = "com.amazon.media.server"

[[wants.service]]
id = "com.amazon.media.playersession.service"

[[wants.privilege]]
id = "com.amazon.devconf.privilege.accessibility"

# RN 0.83 apps load only HTTPS unless cleartext is allowed here. AirPlay video from YouTube is
# served by our own UxPlay at http://<tv-ip>:7200/..., DLNA media is plain http on the LAN, and
# Safari sometimes hands over http URLs, so cleartext has to be allowed for any host.
[network-traffic-policy.cleartext]
allowed-domains = ["*"]
